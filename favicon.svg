<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#090d16"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Terminal Prompt Glyphs -->
  <path d="M16 22 L24 28 L16 34" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="28" y1="34" x2="38" y2="34" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Monogram MSA -->
  <text x="32" y="50" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">MSA</text>
</svg>
